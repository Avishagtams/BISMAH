<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Inputs Examples</title>
</head>
<body>

    <h1>Form Inputs Examples</h1>

    <form>
        <!-- קבוצה ראשונה: שדות טקסט -->
        <fieldset>
            <legend>Text inputs</legend>
            
            <label for="name">Text</label>
            <input type="text" id="name" placeholder="Enter your name"><br><br>

            <label for="password">Password</label>
            <input type="password" id="password"><br><br>

            <label for="email">Email</label>
            <input type="email" id="email">
        </fieldset>

        <br>

        <!-- קבוצה שנייה: קובץ, תמונה, מספר וטווח -->
        <fieldset>
            <legend>File, number and range</legend>

            <label for="file">File</label>
            <input type="file" id="file"><br><br>

            <label for="img-submit">Submit with Image image</label><br>
            <input type="image" id="img-submit" src="" alt="Submit with"><br><br>

            <label for="number">Number</label>
            <input type="number" id="number"><br><br>

            <label for="range">Range</label>
            <input type="range" id="range">
        </fieldset>
    </form>

</body>
</html>
